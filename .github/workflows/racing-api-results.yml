# The Racing API results poller — every 15 min during racing hours.
# Writes results for UK + IRE finalized races within ~15-25 min of post,
# matching the latency profile of the PMU France poller. Idempotent.

name: Racing API results (UK/IRE)

on:
  schedule:
    # Every 15 min between 09:00 and 22:59 UTC. Covers UK + IRE racing
    # hours (10:00-22:00 BST = 09:00-21:00 UTC) plus an evening buffer
    # for late National Hunt cards. Outside this window the morning
    # 02:00 UTC entries cron picks up any tail.
    - cron: '*/15 9-22 * * *'
  workflow_dispatch:

# Don't queue overlapping runs — single-region call should stay under
# 30 seconds, but if TRA is slow we'd rather skip a tick than have
# two writers racing for the same upsert key.
concurrency:
  group: racing-api-results
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./parser
        run: pip install -r requirements.txt

      - name: Run Racing API results poller
        working-directory: ./parser
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: python3 scripts/run_racing_api_results.py
