# PMU France daily — patches FR entries' race_type from PMU's structured
# categorieParticularite, and creates entries up to 3 days ahead vs
# Arion's ~12-hour acceptance lead time. See parser/scripts/run_pmu_daily.py.

name: PMU France daily

on:
  schedule:
    # 02:00 UTC daily — well after the 00:30 UTC daily-scraper.yml run
    # finishes, well before Arion's ~09:40 UTC acceptance email arrives.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  pmu:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./parser
        run: pip install -r requirements.txt

      - name: Run PMU daily walk
        working-directory: ./parser
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/run_pmu_daily.py
